<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futa Login Page</title>
    <link rel="stylesheet" href="Futa login.css">
</head>
<body>
    <div>
        <img src="futa.png" alt="FUTA">
    </div>

    <main>
    <marquee behavior="" direction="" class="to"><i>Welcome to FUTA</i></marquee>
        <a href="#"><p>Please Read Registration Procedure</p></a><br>
    <p class="S">Student's Login</p><br>
    <p class="name">Enter your UTME[Fresher]/Matric No below.</p><br>

    <form action="none" target="_blank">
   
        <label for="UTME or Matric Number" class="mail"></label>
        <input type="text" id="number" name="number"
        placeholder="UTME Or Matric Number" required> <br><br>

          <label for="psw" class="mail"></label>
            <input type="password" id="password" name="password"
            placeholder="Password"
            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[&%#@+]).{8,}"
            title="Must contain uppercase, lowercase, number, 
            symbol and at least 8 characters" required><br><br>

        <button type="submit" class="login">Login Now</button><br><br><hr><br>
        </form>

        <p class="p">Forget your password? <a href="#">Get it Here</a></p>
        <br>
  
    </main>

    <footer>
    <hr><br>
    <p>2026 &copy; FUTA Integrated Registration And <br>
        Result Systems(FIRARS)</p></footer>
</body>
</html>
